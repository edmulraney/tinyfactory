name: setup
description: Install pnpm, Node and the workspace dependencies; optionally the Playwright browser.
inputs:
  playwright:
    description: Also install Chromium for Playwright
    default: "false"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - if: inputs.playwright == 'true'
      run: pnpm --filter web exec playwright install --with-deps chromium
      shell: bash
