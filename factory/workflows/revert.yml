# The `revert` label on a shipped ticket takes it back: an engineer opens the pull request that reverts it.
name: revert

on:
  issues:
    types: [labeled]

jobs:
  revert:
    # A job skipped here costs no minute, where a step would for every label on every ticket (decisions M443b).
    # The event must say a trusted account opened the ticket, or that the owner added the label (decisions W563b).
    if: >-
      github.event.label.name == 'revert' &&
      (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) ||
      contains(fromJSON('["claude[bot]","github-actions[bot]"]'), github.event.issue.user.login) ||
      github.event.sender.login == github.repository_owner)
    # One at a time for a ticket: a second start must find the ticket the first one filed. On the job, so a skipped run cancels none that waits.
    concurrency:
      group: revert-${{ github.event.issue.number }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write         # to file the ticket that takes it back, answer on the labelled one and take the label off
      pull-requests: read   # to read the pull request that shipped it
      actions: write        # to start implement.yml (decisions A241c)
    steps:
      - uses: actions/checkout@v4
      # The event's word is no proof that an account may write, so GitHub is asked before anything is done (decisions W563b).
      - name: Stop unless the account that started this run may write to the repository
        id: trusted
        env:
          GH_TOKEN: ${{ github.token }}
          SENDER: ${{ github.event.sender.login }}
        run: factory/scripts/trusted.sh "$SENDER"
      - name: File the ticket that reverts its commit, and start the build
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          # Who started this attempt, which a run started again by someone else would otherwise hide (decisions M19a).
          STARTED_BY: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
        run: factory/scripts/revert.sh start "$NUMBER" "$STARTED_BY" "$OWNER"
