# Takes a shipped ticket back when the owner starts it with the number of the ticket or of its pull request.
name: revert

on:
  workflow_dispatch:
    inputs:
      number:
        description: Shipped ticket, or its merged pull request, to take back
        required: true

# One at a time: a second start for the same ticket must find the ticket the first one filed.
concurrency:
  group: revert

jobs:
  revert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write         # to file the ticket that takes it back
      pull-requests: read   # to read the pull request that shipped it
      actions: write        # to start implement.yml (decisions A241c)
    steps:
      - uses: actions/checkout@v4
      - name: File the ticket that reverts its commit, and start the build
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ inputs.number }}
          # Who started this attempt, which a run started again by someone else would otherwise hide (decisions M19a).
          STARTED_BY: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
        run: factory/scripts/revert.sh start "$NUMBER" "$STARTED_BY" "$OWNER"
