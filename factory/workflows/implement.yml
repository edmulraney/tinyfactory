# The `ready` label on an issue starts the build: an engineer builds the ticket and opens a pull request.
name: implement

on:
  issues:
    types: [labeled]
  # A workflow's own token starts no build by adding the label, so review-notes.yml starts one here (decisions A241c).
  workflow_dispatch:
    inputs:
      issue:
        description: Number of the ticket to build
        required: true

concurrency:
  group: implement-${{ github.event.issue.number || inputs.issue }}

env:
  # The model each agent runs on, and the second one a job starts on while the first's usage limit holds it; the job's
  # first step writes MODEL, the one its agents run on (decisions A504a, A663a).
  AGENT_MODEL: ${{ vars.AGENT_MODEL || 'claude-fable-5-2' }}
  AGENT_MODEL_FALLBACK: ${{ vars.AGENT_MODEL_FALLBACK || 'claude-opus-5-5' }}
  ISSUE: ${{ github.event.issue.number || inputs.issue }}
  # No background commands in a session with nobody in it (decisions A69f). The hook answers a write to a skill file (decisions A550).
  AGENT_SETTINGS: '{"env":{"CLAUDE_CODE_DISABLE_BACKGROUND_TASKS":"1"},"hooks":{"PermissionRequest":[{"matcher":"Edit|Write","hooks":[{"type":"command","command":"\"$RUNNER_TEMP/factory-scripts/allow-skill-write.sh\" \"$RUNNER_TEMP/ticket-text.txt\""}]}]}}'

jobs:
  implement:
    # For the label, the event must say a trusted account opened the ticket, or that the owner added it (decisions W563b).
    # start-build.sh then asks GitHub who opened it, and tells a ticket it refuses (decisions T563f).
    # On an idea the label starts Peta in refine.yml, and no build (decisions A611b).
    if: >-
      github.event_name == 'workflow_dispatch' || (github.event.label.name == 'ready' &&
      !contains(github.event.issue.labels.*.name, 'idea') &&
      (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) ||
      contains(fromJSON('["claude[bot]","github-actions[bot]"]'), github.event.issue.user.login) ||
      github.event.sender.login == github.repository_owner))
    # The owner's runner when they named one (decisions A426a).
    runs-on: ${{ vars.AGENT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # To start a fix round for a pull request marked ready in conflict (decisions A124f), and the retro (decisions A20).
      actions: write
      id-token: write
    steps:
      # No session reads what an earlier one left in the home folder (decisions A426c).
      - name: Give the job a home folder of its own on the owner's runner
        if: vars.AGENT_RUNNER
        run: mkdir -p "$RUNNER_TEMP/home" && echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4

      # The event's word is no proof that an account may write, so GitHub is asked before anything is done (decisions W563b).
      - name: Stop unless the account that started this run may write to the repository
        id: trusted
        env:
          GH_TOKEN: ${{ github.token }}
          SENDER: ${{ github.event.sender.login }}
        run: factory/scripts/trusted.sh "$SENDER"

      # A limit on the tickets built or checked at once, and never two builds of one ticket (decisions T64a to T64e).
      - name: Take a place among the tickets in flight
        id: place
        env:
          GH_TOKEN: ${{ github.token }}
          BOARD_TOKEN: ${{ secrets.BOARD_TOKEN }}   # lets start-waiting.sh read the order of the board (decisions T335a)
        run: factory/scripts/start-build.sh "$ISSUE"

      # Every step from here runs only for a ticket given a place: a refused build ends green (decisions T64f).
      - name: Validate the ticket against its template
        id: validate
        if: steps.place.outputs.start == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! problems=$(factory/scripts/check-ticket.sh "$ISSUE"); then
            printf 'This ticket is not ready to build:\n\n%s\n\nFix these and add the `ready` label again.\n' "$problems" > "$RUNNER_TEMP/ticket.md"
            gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/ticket.md"
            # The place it took is given back by the job's last step, which need not say why again.
            echo "notified=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - uses: ./.github/actions/setup
        if: steps.place.outputs.start == 'true'
        with:
          playwright: "true"

      - name: Refuse pushes to main from this checkout
        if: steps.place.outputs.start == 'true'
        run: factory/scripts/guard-main.sh

      - name: Choose the engineer
        id: engineer
        if: steps.place.outputs.start == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LABELS: ${{ join(github.event.issue.labels.*.name, ' ') }}
        # Rosa may search and read the web, and her commands are only the ones her skill names (decisions A33a, A33b).
        run: |
          # The event of a build started by number holds no labels (decisions A241c).
          [ -n "$LABELS" ] || LABELS=$(gh issue view "$ISSUE" --json labels --jq '[.labels[].name] | join(" ")')
          tools="Read,Write,Edit,Glob,Grep,Bash"
          case " $LABELS " in
            *" factory "*)  echo "name=Fred" >> "$GITHUB_OUTPUT"; echo "role=fred" >> "$GITHUB_OUTPUT"
                            echo "skill=.claude/skills/factory-engineer/SKILL.md" >> "$GITHUB_OUTPUT" ;;
            *" research "*) echo "name=Rosa" >> "$GITHUB_OUTPUT"; echo "role=rosa" >> "$GITHUB_OUTPUT"
                            echo "skill=.claude/skills/research/SKILL.md" >> "$GITHUB_OUTPUT"
                            tools="Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(git:*),Bash(gh:*),Bash(pnpm lint),Bash(factory/scripts/thread.sh:*),Bash(factory/scripts/check-research.sh:*),Bash(factory/scripts/check-pr-conventions.sh:*),Bash(factory/scripts/hand-over.sh:*)" ;;
            *)              echo "name=Esme" >> "$GITHUB_OUTPUT"; echo "role=esme" >> "$GITHUB_OUTPUT"
                            echo "skill=.claude/skills/implement/SKILL.md" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "tools=$tools" >> "$GITHUB_OUTPUT"

      # The scripts run as main has them, not as an engineer left them.
      - name: Set the scripts aside as they are on main
        if: steps.place.outputs.start == 'true'
        run: cp -R factory/scripts "$RUNNER_TEMP/factory-scripts"

      # Read before the session begins, so that no comment the session writes names a file (decisions A550).
      - name: Keep the ticket's text, which names the skill files the engineer may write
        if: steps.place.outputs.start == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/factory-scripts/thread.sh" "$ISSUE" > "$RUNNER_TEMP/ticket-text.txt"

      # If this fails the engineer starts from main, as when there is nothing to start from (decisions A69d).
      - name: Start from what an earlier build left unfinished
        id: earlier
        if: steps.place.outputs.start == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=$(factory/scripts/unfinished-work.sh "$ISSUE")
          [ -n "$branch" ] || { echo "no earlier build left work for this ticket"; exit 0; }
          git fetch --quiet origin "refs/heads/$branch:refs/remotes/origin/$branch"
          git checkout --quiet -b "$branch" "origin/$branch"
          echo "note=An earlier build of this ticket was cut short before its pull request was ready for review. What it had is on the branch $branch, which is checked out. Its last commits may be unfinished and unverified, so check them as you would your own work; then carry on from them, not from main, on this branch and in its draft pull request if it has one (gh pr list --head $branch); open no second one." >> "$GITHUB_OUTPUT"

      - name: The engineer builds the ticket
        id: agent
        if: steps.place.outputs.start == 'true'
        # A session cut short is continued below; the last step decides whether the job failed.
        continue-on-error: true
        uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The session's token reads the runs' jobs, timings and logs, which it otherwise may not (decisions A259).
          additional_permissions: |
            actions: read
          # review-notes.sh starts this with the workflow's own token, so the actor is a bot; a label from a bot still starts no build.
          allowed_bots: ${{ github.event_name == 'workflow_dispatch' && '*' || '' }}
          settings: ${{ env.AGENT_SETTINGS }}
          prompt: |
            You are ${{ steps.engineer.outputs.name }}. Read ${{ steps.engineer.outputs.skill }} and follow its "Implementing an issue" section for issue #${{ env.ISSUE }} in this repository.
            ${{ steps.earlier.outputs.note }}
          claude_args: |
            --model ${{ env.MODEL || env.AGENT_MODEL }} --effort ${{ vars.AGENT_EFFORT || 'medium' }} --max-turns 200
            --allowedTools "${{ steps.engineer.outputs.tools }}"

      # Continued twice at most, with a wait first when the model's API failed (decisions A69a, A69b).
      - name: Was the session cut short? First look
        id: cut1
        if: steps.place.outputs.start == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/factory-scripts/continue-session.sh" build "${{ steps.agent.outputs.execution_file }}" 120 "${{ steps.engineer.outputs.role }}" "$ISSUE"
      - name: Continue the session
        id: resume1
        if: steps.place.outputs.start == 'true' && steps.cut1.outputs.continue == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |   # as for the step it continues
            actions: read
          allowed_bots: ${{ github.event_name == 'workflow_dispatch' && '*' || '' }}   # as for the step it continues
          settings: ${{ env.AGENT_SETTINGS }}
          prompt: ${{ steps.cut1.outputs.prompt }}
          claude_args: |
            --resume ${{ steps.cut1.outputs.session }}
            --model ${{ env.MODEL || env.AGENT_MODEL }} --effort ${{ vars.AGENT_EFFORT || 'medium' }} --max-turns 200
            --allowedTools "${{ steps.engineer.outputs.tools }}"
      - name: Was the session cut short again? Second and last look
        id: cut2
        if: steps.place.outputs.start == 'true' && steps.cut1.outputs.continue == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/factory-scripts/continue-session.sh" build "${{ steps.resume1.outputs.execution_file || steps.agent.outputs.execution_file }}" 300 "${{ steps.engineer.outputs.role }}" "$ISSUE"
      - name: Continue the session a second time
        id: resume2
        if: steps.place.outputs.start == 'true' && steps.cut2.outputs.continue == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |   # as for the step it continues
            actions: read
          allowed_bots: ${{ github.event_name == 'workflow_dispatch' && '*' || '' }}   # as for the step it continues
          settings: ${{ env.AGENT_SETTINGS }}
          prompt: ${{ steps.cut2.outputs.prompt }}
          claude_args: |
            --resume ${{ steps.cut2.outputs.session }}
            --model ${{ env.MODEL || env.AGENT_MODEL }} --effort ${{ vars.AGENT_EFFORT || 'medium' }} --max-turns 200
            --allowedTools "${{ steps.engineer.outputs.tools }}"

      # Every run of the action writes the same file, so only the last session that began names it: one the time
      # limit killed names none, and its session file is saved, not the earlier result again (decisions A418b).
      - name: Save the session transcript
        if: always() && steps.place.outputs.start == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/factory-scripts/save-session.sh" "${{ steps.engineer.outputs.role }}" "issue-$ISSUE" "${{ steps.cut1.outputs.continue != 'true' && steps.agent.outputs.execution_file || steps.cut2.outputs.continue != 'true' && steps.resume1.outputs.execution_file || steps.resume2.outputs.execution_file }}"
      # An artifact is public on a public repository, and GitHub masks secrets only in logs (decisions A667a).
      - name: Scrub the tokens from the transcripts
        id: scrub
        if: always() && steps.place.outputs.start == 'true' && steps.agent.outputs.execution_file != ''
        run: |
          "$RUNNER_TEMP/factory-scripts/scrub-tokens.sh" "${{ steps.agent.outputs.execution_file }}" "$RUNNER_TEMP/cut-short-sessions"
      - name: Keep a second copy of the transcript on this run
        if: always() && steps.place.outputs.start == 'true' && steps.agent.outputs.execution_file != '' && steps.scrub.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: session-${{ steps.engineer.outputs.role }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.agent.outputs.execution_file }}
            ${{ runner.temp }}/cut-short-sessions
          retention-days: 90

      # A job stopped at its time limit is cancelled as one a person stops is; only it ran its whole limit (decisions A434b).
      - name: Tell whether this job stopped at its time limit
        id: limit
        if: cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LIMIT_MINUTES: 60   # this job's timeout-minutes
        run: |
          started=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
            --jq '.jobs[] | select(.name == env.GITHUB_JOB) | .started_at') && [ -n "$started" ] || {
            echo "Could not read from GitHub when this job started, so whether it stopped at its time limit is not known." >&2
            exit 1
          }
          # The last minute counts as the limit: GitHub's clock and the runner's can differ by seconds.
          # jq reads the time (decisions H632b).
          minutes=$(jq -rn --arg started "$started" '(now - ($started | fromdate)) / 60 | floor + 1')
          echo "this job ran into minute $minutes of $LIMIT_MINUTES"
          [ "$minutes" -lt "$LIMIT_MINUTES" ] || echo "reached=true" >> "$GITHUB_OUTPUT"

      - name: Keep the work and flag the ticket if no pull request ready for review came out
        if: always() && steps.place.outputs.start == 'true' && steps.agent.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          BOARD_TOKEN: ${{ secrets.BOARD_TOKEN }}   # lets start-waiting.sh read the order of the board (decisions T335a)
          FILE: ${{ steps.resume2.outputs.execution_file || steps.resume1.outputs.execution_file || steps.agent.outputs.execution_file }}
        # A pull request that came out in conflict with main gets a fix round from it (decisions A124a).
        run: |
          "$RUNNER_TEMP/factory-scripts/flag-unfinished.sh" build "$ISSUE" "$FILE" "${{ steps.limit.outputs.reached }}"

      # Last, as a step's outcome is not known before its turn: the ticket would hold a place unbuilt (decisions T64g).
      - name: Give the place back when the build never began
        if: always() && steps.place.outputs.start == 'true' && steps.agent.outcome == 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          BOARD_TOKEN: ${{ secrets.BOARD_TOKEN }}   # lets start-waiting.sh read the order of the board (decisions T335a)
        run: factory/scripts/give-back-place.sh "$ISSUE" "${{ steps.validate.outputs.notified }}"

      # A failed job starts the retro of its own run (decisions A20, A434a, A434b). Asked three times: GitHub may be what failed.
      # None for a run an account that is not trusted started (decisions W563c).
      - name: Start a retro when this job failed
        if: steps.trusted.outcome != 'failure' && (failure() || (cancelled() && steps.limit.outputs.reached == 'true'))
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for _ in 1 2 3; do
            if gh workflow run retro.yml -f run="$GITHUB_RUN_ID"; then exit 0; fi
            sleep 20
          done
          exit 1
