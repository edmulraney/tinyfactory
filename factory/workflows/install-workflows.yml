# Installs a merged workflow change the owner approved or need not, from factory/workflows/ into .github/workflows/.
name: install-workflows

on:
  # `_target` runs main's copy of this file; a merge by ship.sh starts no workflow, so ship.sh dispatches this instead.
  pull_request_target:
    types: [closed]
    paths: ['factory/workflows/**']
  workflow_dispatch:
    inputs:
      pr:
        description: Merged pull request whose workflow changes to install
        required: true
      then:
        description: Pull requests merged after it, in the order they merged, to install next. Leave it empty.

concurrency:
  group: install-workflows-${{ inputs.pr || github.event.pull_request.number }}

env:
  PR: ${{ inputs.pr || github.event.pull_request.number }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  RULE: 91dcb3882edd0218863244dded9e892791250b6c   # the git id of factory/scripts/owner-decides.sh (decisions W272b)
  CARRY: 766cc064a2dddbe9b5de24f33b1689bf1c309270   # the git id of factory/scripts/only-merged-main.sh (decisions W456)

jobs:
  install:
    # Only an account that may write merges a pull request, or starts this by number (decisions W563b).
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write   # to start the retro
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0               # the pull request's diff is measured from where it left main, and judged where it merged
          persist-credentials: false   # the push below must use the app's token and no other

      # The event's word is no proof that an account may write, so GitHub is asked before anything is done (decisions W563b).
      - name: Stop unless the account that started this run may write to the repository
        id: trusted
        env:
          GH_TOKEN: ${{ github.token }}
          SENDER: ${{ github.event.sender.login }}
        run: factory/scripts/trusted.sh "$SENDER"

      # Two scripts from the repo are run, each by its git id above and with no token (decisions W2, W272b, W456).
      - name: Check that what would be installed was approved, or needs no approval
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          refused="$RUNNER_TEMP/refused.md"
          : > "$refused"

          view=$(gh pr view "$PR" --json state,baseRefName,headRefOid,mergeCommit,mergedBy,reviews)
          if [ "$(jq -r .state <<<"$view")" != MERGED ] || [ "$(jq -r .baseRefName <<<"$view")" != "$DEFAULT_BRANCH" ]; then
            echo "pull request #$PR is not merged into $DEFAULT_BRANCH; nothing to install"
            exit 0
          fi
          head=$(jq -r .headRefOid <<<"$view")

          # The merged branch is deleted, but GitHub keeps the pull request's last commit here.
          git fetch --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/pull/$PR/head"
          [ "$(git rev-parse FETCH_HEAD)" = "$head" ]
          # It is judged against main as its merge left it: a later merge to the same source is the next run's (decisions W469a).
          merged=$(jq -r '.mergeCommit.oid // ""' <<<"$view")
          git merge-base --is-ancestor "$merged" HEAD || {
            echo "the merge commit of pull request #$PR, \"$merged\", is not on $DEFAULT_BRANCH, so what its merge left there is not known"
            exit 1
          }
          # Installed once: started again, it could bring back a workflow that a later merge undid (decisions W496).
          # "approved in" is the subject of the installs made before an unapproved change could be installed.
          earlier_install=$(git log --format=%h -E --grep="^ci: install the workflow changes (approved|merged) in #$PR\$" "$merged..HEAD" | tail -1)
          if [ -n "$earlier_install" ]; then
            echo "commit $earlier_install on $DEFAULT_BRANCH already installed the workflow changes of pull request #$PR, so nothing is installed for it again"
            exit 0
          fi
          base=$(git merge-base "$merged^" "$head")
          blob() { git rev-parse --quiet --verify "$1:$2" 2>/dev/null || echo absent; }
          # The merge's source is the installed copy with the reviewed diff of that source applied (decisions W425).
          applies_to_installed() {
            local work="$RUNNER_TEMP/applied"
            rm -rf "$work"; mkdir -p "$work"
            git cat-file blob "HEAD:$installed" > "$work/installed" 2>/dev/null &&
              git cat-file blob "$base:$source" > "$work/base" 2>/dev/null &&
              git cat-file blob "$head:$source" > "$work/reviewed" 2>/dev/null &&
              git merge-file --quiet "$work/installed" "$work/base" "$work/reviewed" 2>/dev/null &&
              [ "$(git hash-object --no-filters "$work/installed")" = "$at_merge" ]
          }

          # Whether it only puts back what main held before a merge the owner made with the merge button, which needs
          # no approval: the merge gate's test, made again here (decisions M439f, W3).
          undoes_button_merge() {
            local issue ticket taken merge commit paths path
            issue=$(gh pr view "$PR" --json body --jq '.body // ""' | grep -oiE '(closes|fixes|resolves) #[0-9]+' | grep -oE '[0-9]+' | head -1) || return 1
            ticket=$(gh issue view "$issue" --json title,author) || return 1
            # Only a workflow files a ticket as `app/github-actions`, and revert.sh titles it so (decisions M439d).
            [ "$(jq -r .author.login <<<"$ticket")" = app/github-actions ] || return 1
            [[ "$(jq -r .title <<<"$ticket")" =~ ^"Take back the button merge of pull request #"([0-9]+)$ ]] || return 1
            taken="${BASH_REMATCH[1]}"
            merge=$(gh pr view "$taken" --json mergedBy,mergeCommit) || return 1
            [ "$(jq -r '.mergedBy.login // ""' <<<"$merge")" = "$OWNER" ] || return 1
            commit=$(jq -r '.mergeCommit.oid // ""' <<<"$merge")
            [ -n "$commit" ] || return 1
            paths=$(git -c core.quotePath=false diff --no-renames --name-only "$base" "$head" &&
              git -c core.quotePath=false diff --no-renames --name-only "$commit^" "$commit") && [ -n "$paths" ] || return 1
            # Nothing has changed a file since that merge, and each goes back to what main held before it.
            while IFS= read -r path; do
              [ "$(git ls-tree "$base" -- "$path")" = "$(git ls-tree "$commit" -- "$path")" ] &&
                [ "$(git ls-tree "$head" -- "$path")" = "$(git ls-tree "$commit^" -- "$path")" ] || return 1
            done <<<"$paths"
          }

          # The owner merging it themselves is the same decision as approving the commit that was merged.
          approved=$(jq -r --arg owner "$OWNER" --arg head "$head" '
            (.mergedBy.login == $owner) or
            ([.reviews[] | select(.author.login == $owner)] | last | (.state == "APPROVED" and .commit.oid == $head))' <<<"$view")
          # An approval of an earlier commit stands when only merges of the default branch followed it (decisions W456).
          earlier=$(jq -r --arg owner "$OWNER" \
            '[.reviews[] | select(.author.login == $owner)] | last | select(.state == "APPROVED") | .commit.oid // ""' <<<"$view")
          if [ "$approved" != true ] && [ -n "$earlier" ]; then
            if [ "$(blob HEAD factory/scripts/only-merged-main.sh)" != "$CARRY" ]; then
              echo "factory/scripts/only-merged-main.sh on $DEFAULT_BRANCH is not the script this installer names (${CARRY:0:7}), so the approval of ${earlier:0:7} is not carried to ${head:0:7}"
            else
              git cat-file blob "$CARRY" > "$RUNNER_TEMP/only-merged-main.sh"
              # It is given the three commits and nothing else: no token, and nothing of the environment.
              if env -i PATH="$PATH" bash "$RUNNER_TEMP/only-merged-main.sh" "$earlier" "$head" HEAD; then
                approved=true
              else
                echo "so the approval of ${earlier:0:7} is not carried to ${head:0:7}"
              fi
            fi
          fi
          if [ "$approved" != true ]; then
            # Unapproved, it is installed only if the merge gate merged it and would again (decisions W3, W272a).
            unapproved="\`$OWNER\` neither approved commit \`${head:0:7}\` nor merged it themselves, and"
            # `app/github-actions` is how gh writes the workflows' own token, which an agent's session does not push with.
            if [ "$(jq -r '.mergedBy.login' <<<"$view")" != app/github-actions ]; then
              echo "- $unapproved it was not the merge gate that merged it." >> "$refused"
              exit 1
            fi
            if [ "$(blob HEAD factory/scripts/owner-decides.sh)" != "$RULE" ]; then
              echo "- $unapproved \`factory/scripts/owner-decides.sh\` on \`$DEFAULT_BRANCH\` is not the script this installer names (\`${RULE:0:7}\`), so nothing the owner approved says whether this change needs them." >> "$refused"
              exit 1
            fi
            git cat-file blob "$RULE" > "$RUNNER_TEMP/owner-decides.sh"
            # It is given the diff and nothing else: no token, and nothing of the environment.
            if ! theirs=$(git diff "$base" "$head" | env -i PATH="$PATH" bash "$RUNNER_TEMP/owner-decides.sh" 2>&1) && ! undoes_button_merge; then
              {
                echo "- $unapproved it changes what only they may decide:"
                printf '\n  ```\n%s\n  ```\n' "$(sed 's/^/  /' <<<"$theirs")"
              } >> "$refused"
              exit 1
            fi
          fi

          # main is not locked on the free plan: a source pushed straight to it or an old approval replayed is refused.
          mkdir -p .github/workflows
          while IFS= read -r source; do
            [ -n "$source" ] || continue
            name="${source#factory/workflows/}"
            installed=".github/workflows/$name"
            read_by_owner=$(blob "$head" "$source")
            at_merge=$(blob "$merged" "$source")
            if [ "$(blob HEAD "$installed")" = "$read_by_owner" ]; then
              echo "$installed is already what was approved"
            # A pull request installed earlier and since undone would otherwise bring its old workflow back (decisions W469c).
            elif [ "$(blob HEAD "$installed")" = "$(blob HEAD "$source")" ]; then
              echo "$installed is already what $source on $DEFAULT_BRANCH holds, so nothing waits to be installed"
            elif [[ "$name" == */* ]]; then
              echo "- \`$source\` is in a folder. GitHub runs only the files directly in \`.github/workflows/\`." >> "$refused"
            elif [ "$read_by_owner" != absent ] && ! git ls-tree "$head" -- "$source" | grep -qE '^100(644|755) blob '; then
              echo "- \`$source\` is not an ordinary file (a link, perhaps), so its diff does not show what would run." >> "$refused"
            elif [ "$at_merge" != "$read_by_owner" ] && ! applies_to_installed; then
              echo "- \`$source\` on \`$DEFAULT_BRANCH\`, as this pull request's merge \`${merged:0:7}\` left it, is neither what commit \`${head:0:7}\` held nor \`$installed\` with that commit's change of the file applied, so it holds a change that was not reviewed in this pull request, or one not installed yet." >> "$refused"
            elif [ "$at_merge" = "$read_by_owner" ] && [ "$(blob HEAD "$installed")" != "$(blob "$base" "$source")" ]; then
              echo "- \`$installed\` is not what this pull request's diff of \`$source\` was made against, so the diff that was reviewed is not the whole difference between what runs now and what would run." >> "$refused"
            elif [ "$at_merge" = absent ]; then
              git rm --quiet "$installed"
              echo "removed $installed"
            else
              # From git, not the checked-out file: copying that would follow a link to bytes nobody approved.
              git update-index --add --cacheinfo "100644,$at_merge,$installed"
              echo "installed $source as $installed"
            fi
          done < <(git diff --no-renames --name-only "$base" "$head" -- factory/workflows)

          # All or nothing: a pull request's workflows are reviewed together.
          [ ! -s "$refused" ] || exit 1
          if git diff --cached --quiet; then
            echo "pull request #$PR has no workflow change left to install"
          else
            echo "install=true" >> "$GITHUB_OUTPUT"
          fi

      # The workflow's own token cannot write a workflow file, by GitHub's design; this one is minted after the checks.
      - name: Get a short-lived token that may write workflow files
        id: app
        if: steps.check.outputs.install == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.WORKFLOW_APP_CLIENT_ID }}
          private-key: ${{ secrets.WORKFLOW_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Commit the copies
        if: steps.check.outputs.install == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
          BOT: ${{ steps.app.outputs.app-slug }}[bot]
        run: |
          set -euo pipefail
          # By this subject a later run tells that the pull request is installed (decisions W496).
          git -c user.name="$BOT" -c user.email="$BOT@users.noreply.github.com" \
            commit --quiet -m "ci: install the workflow changes merged in #$PR"
          # If main moved since the checkout this is refused, and the run can simply be started again.
          git push --quiet "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$DEFAULT_BRANCH"
          # The record first-runs.sh reads (decisions A185a); a label that could not be added fails nothing.
          changed=$(git show --diff-filter=AM --name-only --format= HEAD -- .github/workflows | sed 's|^\.github/workflows/||' | xargs)
          labelled=yes
          [ -z "$changed" ] || gh pr edit "$PR" --add-label proof >/dev/null || labelled=no
          {
            printf 'Installed in %s, the workflow changes this pull request merged:\n\n```\n' "$(git rev-parse --short HEAD)"
            git show --name-status --format= HEAD
            printf '```\n'
            if [ -n "$changed" ]; then
              if [ "$labelled" = yes ]; then
                printf '\nA retro will look at the first run of each and say here whether it did what this pull request claimed.\n'
              else
                printf '\nThis pull request could not be labelled `proof`, so no retro will look at the first run of each. Add the label by hand to have one.\n'
              fi
              printf '\n<!-- factory:installed %s -->\n' "$changed"
            fi
          } > "$RUNNER_TEMP/installed.md"
          gh pr comment "$PR" --body-file "$RUNNER_TEMP/installed.md"

      # Nothing is said in a run an account that is not trusted started (decisions W563c).
      - name: Tell a person when the change was not installed
        if: steps.trusted.outcome != 'failure' && failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The first line says what a person must do (decisions A371a).
          {
            if [ -s "$RUNNER_TEMP/refused.md" ]; then
              printf 'File the two `factory` tickets described below: the factory installs nothing until the second merges.\n\n'
            else
              # The link is written here, as workflow-page.sh writes it: this step runs when the checkout failed too.
              printf 'Read the log linked below, then start the installer again on the [`install-workflows` workflow'"'"'s page](%s/%s/actions/workflows/install-workflows.yml), where "Run workflow" starts it with `pr` set to `%s`. The changes are installed when that run passes.\n\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$PR"
            fi
            printf 'The workflow changes in this pull request were **not installed**, so `.github/workflows/` still runs the earlier versions and `pnpm lint` fails on `%s` until the two folders match.\n\n' "$DEFAULT_BRANCH"
            if [ -s "$RUNNER_TEMP/refused.md" ]; then
              cat "$RUNNER_TEMP/refused.md"
              # A new change on top of main would be refused too: its diff would start from a source never installed.
              printf '\nNothing was installed. To recover, in two `factory` tickets: first put each workflow this pull request changed in `factory/workflows/` back to exactly what `.github/workflows/` holds (deleting it if there is none), which makes `pnpm lint` pass again and installs nothing; then make the change again from there, so the whole difference is reviewed in one diff.\n'
            else
              printf 'The checks passed or never finished, and a later step failed: the log says which. If it was the push, start `install-workflows` again with this pull request'"'"'s number. If it was the token, the project has no workflow app yet: `.claude/skills/bootstrap/scripts/workflow-app.sh` creates it.\n'
            fi
            printf '\n%s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/not-installed.md"
          gh pr comment "$PR" --body-file "$RUNNER_TEMP/not-installed.md"
          # The pull request is merged and its ticket closed, so the label goes on the ticket when there is one.
          issue=$(gh pr view "$PR" --json body --jq '.body // ""' | grep -oiE '(closes|fixes|resolves) #[0-9]+' | grep -oE '[0-9]+' | head -1 || true)
          if [ -n "$issue" ]; then gh issue edit "$issue" --add-label needs-human >/dev/null
          else gh pr edit "$PR" --add-label needs-human >/dev/null
          fi

      # Whatever became of this one: a later merge that changed other sources installs all the same (decisions W469b).
      - name: Start the installer for the pull request merged after this one
        if: always() && inputs.then != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          THEN: ${{ inputs.then }}
        run: |
          read -r next rest <<<"$THEN"
          for _ in 1 2 3; do
            if gh workflow run install-workflows.yml -f pr="$next" ${rest:+-f then="$rest"}; then exit 0; fi
            sleep 20
          done
          {
            # The link is written here, as workflow-page.sh writes it: this step runs when the checkout failed too.
            printf 'Start the installer on the [`install-workflows` workflow'"'"'s page](%s/%s/actions/workflows/install-workflows.yml), where "Run workflow" starts it with `pr` set to `%s`' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$next"
            [ -z "$rest" ] || printf ' and `then` set to `%s`' "$rest"
            printf '. That run installs the workflow changes this pull request merged.\n\n'
            printf 'They are **not installed**: the installer of pull request #%s, merged before this one, could not start this one'"'"'s.\n' "$PR"
            printf '\n%s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/not-started.md"
          gh pr comment "$next" --body-file "$RUNNER_TEMP/not-started.md"
          gh pr edit "$next" --add-label needs-human >/dev/null
          exit 1

      # A job stopped at its time limit is cancelled as one a person stops is; only it ran its whole limit (decisions A434b).
      - name: Tell whether this job stopped at its time limit
        id: limit
        if: cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LIMIT_MINUTES: 5   # this job's timeout-minutes
        run: |
          started=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
            --jq '.jobs[] | select(.name == env.GITHUB_JOB) | .started_at') && [ -n "$started" ] || {
            echo "Could not read from GitHub when this job started, so whether it stopped at its time limit is not known." >&2
            exit 1
          }
          # The last minute counts as the limit: GitHub's clock and the runner's can differ by seconds.
          # jq reads the time (decisions H632b).
          minutes=$(jq -rn --arg started "$started" '(now - ($started | fromdate)) / 60 | floor + 1')
          echo "this job ran into minute $minutes of $LIMIT_MINUTES"
          [ "$minutes" -lt "$LIMIT_MINUTES" ] || echo "reached=true" >> "$GITHUB_OUTPUT"
      # A failed job starts the retro of its own run (decisions A20, A434a, A434b). Asked three times: GitHub may be what failed.
      # None for a run an account that is not trusted started (decisions W563c).
      - name: Start a retro when this job failed
        if: steps.trusted.outcome != 'failure' && (failure() || (cancelled() && steps.limit.outputs.reached == 'true'))
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for _ in 1 2 3; do
            if gh workflow run retro.yml -f run="$GITHUB_RUN_ID"; then exit 0; fi
            sleep 20
          done
          exit 1
